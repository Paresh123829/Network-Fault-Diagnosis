version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════
# Multi-Agent AI Framework — Docker Compose
#
# Phase 0: Infrastructure services only (MongoDB + Qdrant).
# Application services (ai, api, frontend) are added in later phases
# once they are fully implemented.
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ── MongoDB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: cnt_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-cnt_fault_diagnosis}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./database/schemas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant ────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: cnt_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python AI Service (Phase 0: scaffold only) ───────────────────────────
  # Uncomment when services/ai/ is ready to containerize (Phase 6+)
  # ai:
  #   build:
  #     context: ./services/ai
  #     dockerfile: Dockerfile
  #   container_name: cnt_ai
  #   restart: unless-stopped
  #   env_file: .env
  #   ports:
  #     - "${AI_SERVICE_PORT:-8000}:8000"
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy
  #     qdrant:
  #       condition: service_healthy

  # ── Node.js API (Phase 10+) ───────────────────────────────────────────────
  # api:
  #   build:
  #     context: ./services/api
  #     dockerfile: Dockerfile
  #   container_name: cnt_api
  #   restart: unless-stopped
  #   env_file: .env
  #   ports:
  #     - "${API_PORT:-4000}:4000"
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy

  # ── React Frontend (Phase 11+) ────────────────────────────────────────────
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: cnt_frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - api

volumes:
  mongodb_data:
  qdrant_data:
