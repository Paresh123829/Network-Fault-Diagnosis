# ═══════════════════════════════════════════════════════════════════════════
# Containerlab Topology: Multi-Protocol Network Fault & Remediation Testbed
# ═══════════════════════════════════════════════════════════════════════════
#
# Topology Architecture
# ---------------------
#                   eth1          eth1
#            R1 ───────────── R2 ───────────── R3
#             │ 172.16.12.0/30  172.16.23.0/30 │
#             │                                │
#             │         172.16.13.0/30         │
#             └────────────────────────────────┘
#                (Alternate Path: R1:eth3 ↔ R3:eth2)
#
#             R1:eth2 ───┐            ┌─── R2:eth3
#           (802.1Q trunk)            (802.1Q trunk)
#                        ▼            ▼
#                   ┌───────────────────────┐
#                   │   br-vlan (Linux L2)   │
#                   │  (VLAN 100, VLAN 200) │
#                   └───────────────────────┘
#                        ▲            ▲
#           (VLAN 100)   │            │   (VLAN 100)
#            client1:eth1 ┘            └── client2:eth1
#            192.168.100.10/24         192.168.100.20/24
#
# Protocols Supported:
#   1. Underlay: OSPF Area 0 across all point-to-point links.
#   2. Overlay: eBGP peering (R1: 65001, R2: 65002, R3: 65003) with redundant peering.
#   3. Fast Convergence: BFD daemon enabled on R1 ↔ R2 and R2 ↔ R3.
#   4. Layer 2 / Switching: Linux VLAN-aware bridge (br-vlan) with 802.1Q subinterfaces.
#
# Usage:
#   sudo containerlab deploy -t topology.yml    # start lab
#   sudo containerlab destroy -t topology.yml   # stop & clean up
# ═══════════════════════════════════════════════════════════════════════════

name: cnt-frr-lab

mgmt:
  network: cnt-mgmt
  ipv4-subnet: 172.20.0.0/24

topology:
  nodes:

    R1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf:ro
        - configs/r1/daemons:/etc/frr/daemons:ro
        - configs/r1/vtysh.conf:/etc/frr/vtysh.conf:ro
      labels:
        role: edge-router
        asn: "65001"
        bfd_enabled: "true"

    R2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/r2/frr.conf:/etc/frr/frr.conf:ro
        - configs/r2/daemons:/etc/frr/daemons:ro
        - configs/r2/vtysh.conf:/etc/frr/vtysh.conf:ro
      labels:
        role: transit-router
        asn: "65002"
        bfd_enabled: "true"

    R3:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/r3/frr.conf:/etc/frr/frr.conf:ro
        - configs/r3/daemons:/etc/frr/daemons:ro
        - configs/r3/vtysh.conf:/etc/frr/vtysh.conf:ro
      labels:
        role: edge-router
        asn: "65003"
        bfd_enabled: "true"

    br-vlan:
      kind: linux
      image: alpine:latest
      exec:
        - ip link add name br0 type bridge vlan_filtering 1
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth1 up
        - ip link set eth2 master br0
        - ip link set eth2 up
        - ip link set eth3 master br0
        - ip link set eth3 up
        - ip link set eth4 master br0
        - ip link set eth4 up
        - bridge vlan add dev eth1 vid 100
        - bridge vlan add dev eth1 vid 200
        - bridge vlan add dev eth2 vid 100
        - bridge vlan add dev eth2 vid 200
        - bridge vlan add dev eth3 vid 100 pvid untagged
        - bridge vlan add dev eth4 vid 100 pvid untagged
      labels:
        role: l2-bridge
        vlan_filtering: "true"

    client1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.100.10/24 dev eth1
        - ip link set eth1 up
        - ip route add default via 192.168.100.1
      labels:
        role: endpoint
        vlan: "100"

    client2:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.100.20/24 dev eth1
        - ip link set eth1 up
        - ip route add default via 192.168.100.1
      labels:
        role: endpoint
        vlan: "100"

  links:
    # Primary Transit Links
    - endpoints: ["R1:eth1", "R2:eth1"]
    - endpoints: ["R2:eth2", "R3:eth1"]

    # Alternate Redundant Transit Link (R1 ↔ R3)
    - endpoints: ["R1:eth3", "R3:eth2"]

    # L2 Bridge Connections (Trunk links from routers to br-vlan)
    - endpoints: ["R1:eth2", "br-vlan:eth1"]
    - endpoints: ["R2:eth3", "br-vlan:eth2"]

    # Client Connections (Access links from clients to br-vlan)
    - endpoints: ["client1:eth1", "br-vlan:eth3"]
    - endpoints: ["client2:eth1", "br-vlan:eth4"]
