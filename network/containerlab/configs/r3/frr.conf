! ═══════════════════════════════════════════════════════════════════════════
! R3 — FRRouting configuration (Enhanced for Milestone 7)
! Role    : Edge router
! ASN     : 65003
! Loopback: 10.0.0.3/32
! eth1    : 172.16.23.2/30  (Primary link to R2)
! eth2    : 172.16.13.2/30  (Alternate redundant link to R1)
! ═══════════════════════════════════════════════════════════════════════════

frr version 9.0
frr defaults traditional
hostname R3
no ipv6 forwarding
service integrated-vtysh-config

! ─── Interfaces ──────────────────────────────────────────────────────────────
interface lo
 ip address 10.0.0.3/32
 description "R3 loopback"

interface eth1
 ip address 172.16.23.2/30
 description "R3 → R2 primary transit link"
 ip ospf area 0
 ip ospf hello-interval 5
 ip ospf dead-interval 20
 ip ospf bfd

interface eth2
 ip address 172.16.13.2/30
 description "R3 → R1 alternate redundant link"
 ip ospf area 0
 ip ospf cost 50
 ip ospf hello-interval 5
 ip ospf dead-interval 20

! ─── BFD Configuration ───────────────────────────────────────────────────────
bfd
 peer 172.16.23.1
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 exit
!

! ─── OSPF ────────────────────────────────────────────────────────────────────
router ospf
 ospf router-id 10.0.0.3
 network 10.0.0.3/32 area 0
 network 172.16.23.0/30 area 0
 network 172.16.13.0/30 area 0
 passive-interface lo

! ─── BGP ─────────────────────────────────────────────────────────────────────
router bgp 65003
 bgp router-id 10.0.0.3
 bgp log-neighbor-changes
 !
 neighbor 172.16.23.1 remote-as 65002
 neighbor 172.16.23.1 description "eBGP to R2"
 neighbor 172.16.23.1 timers 10 30
 neighbor 172.16.23.1 bfd
 !
 neighbor 172.16.13.1 remote-as 65001
 neighbor 172.16.13.1 description "eBGP to R1 (alternate)"
 neighbor 172.16.13.1 timers 10 30
 !
 address-family ipv4 unicast
  network 10.0.0.3/32
  neighbor 172.16.23.1 activate
  neighbor 172.16.23.1 soft-reconfiguration inbound
  neighbor 172.16.13.1 activate
  neighbor 172.16.13.1 soft-reconfiguration inbound
 exit-address-family

! ─── Logging ─────────────────────────────────────────────────────────────────
log syslog informational
log record-priority
