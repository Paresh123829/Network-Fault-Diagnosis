! ═══════════════════════════════════════════════════════════════════════════
! R2 — FRRouting configuration (Enhanced for Milestone 7)
! Role    : Transit / spine router
! ASN     : 65002
! Loopback: 10.0.0.2/32
! eth1    : 172.16.12.2/30  (Primary link to R1)
! eth2    : 172.16.23.1/30  (Primary link to R3)
! eth3    : Trunk to br-vlan (802.1Q subinterface .100)
! ═══════════════════════════════════════════════════════════════════════════

frr version 9.0
frr defaults traditional
hostname R2
no ipv6 forwarding
service integrated-vtysh-config

! ─── Interfaces ──────────────────────────────────────────────────────────────
interface lo
 ip address 10.0.0.2/32
 description "R2 loopback"

interface eth1
 ip address 172.16.12.2/30
 description "R2 → R1 link"
 ip ospf area 0
 ip ospf hello-interval 5
 ip ospf dead-interval 20
 ip ospf bfd

interface eth2
 ip address 172.16.23.1/30
 description "R2 → R3 link"
 ip ospf area 0
 ip ospf hello-interval 5
 ip ospf dead-interval 20
 ip ospf bfd

interface eth3
 description "R2 → br-vlan 802.1Q trunk base interface"

interface eth3.100
 ip address 192.168.100.2/24
 description "VLAN 100 secondary gateway"

! ─── BFD Configuration ───────────────────────────────────────────────────────
bfd
 peer 172.16.12.1
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 exit
 peer 172.16.23.2
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 exit
!

! ─── OSPF ────────────────────────────────────────────────────────────────────
router ospf
 ospf router-id 10.0.0.2
 network 10.0.0.2/32 area 0
 network 172.16.12.0/30 area 0
 network 172.16.23.0/30 area 0
 passive-interface lo
 passive-interface eth3.100

! ─── BGP ─────────────────────────────────────────────────────────────────────
router bgp 65002
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 !
 neighbor 172.16.12.1 remote-as 65001
 neighbor 172.16.12.1 description "eBGP to R1"
 neighbor 172.16.12.1 timers 10 30
 neighbor 172.16.12.1 bfd
 !
 neighbor 172.16.23.2 remote-as 65003
 neighbor 172.16.23.2 description "eBGP to R3"
 neighbor 172.16.23.2 timers 10 30
 neighbor 172.16.23.2 bfd
 !
 address-family ipv4 unicast
  network 10.0.0.2/32
  neighbor 172.16.12.1 activate
  neighbor 172.16.12.1 soft-reconfiguration inbound
  neighbor 172.16.12.1 next-hop-self
  neighbor 172.16.23.2 activate
  neighbor 172.16.23.2 soft-reconfiguration inbound
  neighbor 172.16.23.2 next-hop-self
 exit-address-family

! ─── Logging ─────────────────────────────────────────────────────────────────
log syslog informational
log record-priority
