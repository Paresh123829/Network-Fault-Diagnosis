! ═══════════════════════════════════════════════════════════════════════════
! R1 — FRRouting configuration (Enhanced for Milestone 7)
! Role    : Edge router
! ASN     : 65001
! Loopback: 10.0.0.1/32
! eth1    : 172.16.12.1/30  (Primary link to R2)
! eth2    : Trunk to br-vlan (802.1Q subinterfaces .100 and .200)
! eth3    : 172.16.13.1/30  (Alternate redundant link to R3)
! ═══════════════════════════════════════════════════════════════════════════

frr version 9.0
frr defaults traditional
hostname R1
no ipv6 forwarding
service integrated-vtysh-config

! ─── Interfaces ──────────────────────────────────────────────────────────────
interface lo
 ip address 10.0.0.1/32
 description "R1 loopback"

interface eth1
 ip address 172.16.12.1/30
 description "R1 → R2 primary transit link"
 ip ospf area 0
 ip ospf hello-interval 5
 ip ospf dead-interval 20
 ip ospf bfd

interface eth2
 description "R1 → br-vlan 802.1Q trunk base interface"

interface eth2.100
 ip address 192.168.100.1/24
 description "VLAN 100 Gateway"

interface eth2.200
 ip address 192.168.200.1/24
 description "VLAN 200 Gateway"

interface eth3
 ip address 172.16.13.1/30
 description "R1 → R3 alternate redundant link"
 ip ospf area 0
 ip ospf cost 50
 ip ospf hello-interval 5
 ip ospf dead-interval 20

! ─── BFD Configuration ───────────────────────────────────────────────────────
bfd
 peer 172.16.12.2
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 exit
!

! ─── OSPF ────────────────────────────────────────────────────────────────────
router ospf
 ospf router-id 10.0.0.1
 network 10.0.0.1/32 area 0
 network 172.16.12.0/30 area 0
 network 172.16.13.0/30 area 0
 network 192.168.100.0/24 area 0
 passive-interface lo
 passive-interface eth2.100
 passive-interface eth2.200

! ─── BGP ─────────────────────────────────────────────────────────────────────
router bgp 65001
 bgp router-id 10.0.0.1
 bgp log-neighbor-changes
 !
 neighbor 172.16.12.2 remote-as 65002
 neighbor 172.16.12.2 description "eBGP to R2"
 neighbor 172.16.12.2 timers 10 30
 neighbor 172.16.12.2 bfd
 !
 neighbor 172.16.13.2 remote-as 65003
 neighbor 172.16.13.2 description "eBGP to R3 (alternate)"
 neighbor 172.16.13.2 timers 10 30
 !
 address-family ipv4 unicast
  network 10.0.0.1/32
  network 192.168.100.0/24
  neighbor 172.16.12.2 activate
  neighbor 172.16.12.2 soft-reconfiguration inbound
  neighbor 172.16.13.2 activate
  neighbor 172.16.13.2 soft-reconfiguration inbound
 exit-address-family

! ─── Logging ─────────────────────────────────────────────────────────────────
log syslog informational
log record-priority
